<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="AIRE: consola de emisión para escuchar la radio en directo (COPE, Cadena SER, RNE, LOS 40, Cadena 100 y más) y ver televisión (La 1, La 2, 24 Horas, 3CatInfo, TRECE y más)." />
  <meta name="theme-color" content="#0d0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AIRE" />
  <meta name="application-name" content="AIRE" />
  <title>AIRE — Radio y TV en directo</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f14'/%3E%3Ccircle cx='16' cy='14' r='3' fill='%23d13438'/%3E%3Cpath d='M9 20a10 10 0 0 1 0-12M23 8a10 10 0 0 1 0 12' stroke='%234f7dff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 17v9M11 26h10' stroke='%23e8ecf4' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/station-list.css" />
  <link rel="stylesheet" href="./css/radio-player.css" />
  <link rel="stylesheet" href="./css/search.css" />
  <link rel="stylesheet" href="./css/list-toolbar.css" />
  <link rel="stylesheet" href="./css/mini-player.css" />
  <link rel="stylesheet" href="./css/install.css" />
  <link rel="stylesheet" href="./css/video.css" />
  <link rel="stylesheet" href="./css/motion.css" />
  <link rel="stylesheet" href="./css/view-transitions.css" />
  <script type="module" src="./main.js"></script>
</head>

<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <header class="site-header">
    <div class="brand">
      <span class="brand__beacon" aria-hidden="true"></span>
      <div class="brand__text">
        <h1 class="brand__name">AIRE</h1>
      </div>
    </div>

    <nav class="site-nav" aria-label="Secciones de la consola">
      <div class="tablist" role="tablist" aria-label="Radio y televisión">
        <button class="tab" type="button" role="tab" id="tab-radio" aria-controls="panel-radio" aria-selected="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8.5" r="2.1" fill="currentColor" />
            <path
              d="M8.6 11.9a4.8 4.8 0 0 1 0-6.8M15.4 5.1a4.8 4.8 0 0 1 0 6.8M6 14.5a8.4 8.4 0 0 1 0-12M18 2.5a8.4 8.4 0 0 1 0 12"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <path d="M12 10.8V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          Radio
        </button>
        <button class="tab" type="button" role="tab" id="tab-tv" aria-controls="panel-tv" aria-selected="false"
          tabindex="-1">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="7" width="18" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="m8.5 2.8 3.5 4.2 3.5-4.2" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" />
            <path d="M7.5 15.2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          TV
        </button>
      </div>
    </nav>

    <search class="site-search">
      <label class="visually-hidden" for="console-search">Buscar emisoras o canales</label>
      <svg class="icon site-search__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
        focusable="false">
        <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="m15.5 15.5 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <input class="site-search__input" type="search" id="console-search" placeholder="Buscar emisora o canal"
        autocomplete="off" />
    </search>

    <button class="install-button" type="button" id="install-button" hidden>
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4" fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round" />
        <path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" />
      </svg>
      <span>Instalar app</span>
    </button>
  </header>

  <main class="site-main" id="main-content" tabindex="-1">
    <section class="panel" id="panel-radio" role="tabpanel" aria-labelledby="tab-radio">
      <div class="radio-desk">
        <div class="radio-player" id="radio-player" aria-label="Reproductor de audio en directo">
          <div class="radio-player__empty" id="radio-player-empty">
            <svg class="icon icon--antenna" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
              focusable="false">
              <circle cx="12" cy="9" r="2.4" fill="currentColor" />
              <path
                d="M8.2 12.8a5.4 5.4 0 0 1 0-7.6M15.8 5.2a5.4 5.4 0 0 1 0 7.6M5.4 15.6a9.4 9.4 0 0 1 0-13.2M18.6 2.4a9.4 9.4 0 0 1 0 13.2"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              <path d="M12 11.6V22M8.5 22h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
            <p>Elige una emisora para empezar a escuchar</p>
          </div>

          <div class="radio-player__body" id="radio-player-body" hidden>
            <span class="radio-player__logo" id="radio-player-logo" aria-hidden="true"></span>
            <div class="radio-player__text">
              <p class="radio-player__title" id="radio-player-title"></p>
              <p class="radio-player__subtitle" id="radio-player-subtitle"></p>
              <span class="radio-player__source" id="radio-player-source" hidden>TV · SOLO AUDIO</span>
            </div>
            <span class="live-badge radio-player__state" id="radio-player-state"></span>

            <div class="radio-player__controls">
              <button class="icon-button" type="button" id="radio-player-toggle">
                <svg class="icon icon--play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                  focusable="false" hidden>
                  <path d="M8 5.13v13.74a1 1 0 0 0 1.52.85l10.77-6.87a1 1 0 0 0 0-1.7L9.52 4.28A1 1 0 0 0 8 5.13Z"
                    fill="currentColor" />
                </svg>
                <svg class="icon icon--pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                  focusable="false">
                  <rect x="7" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" />
                  <rect x="13.6" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" />
                </svg>
                <span class="visually-hidden" data-toggle-label>Pausar</span>
              </button>

              <button class="icon-button" type="button" id="radio-player-mute" aria-pressed="false">
                <svg class="icon icon--volume" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                  focusable="false">
                  <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor" />
                  <path d="M14.8 9.3a4 4 0 0 1 0 5.4" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" />
                  <path d="M17.5 6.8a7.5 7.5 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" />
                </svg>
                <svg class="icon icon--muted" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                  focusable="false" hidden>
                  <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor" />
                  <path d="m15 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" />
                </svg>
                <span class="visually-hidden" data-mute-label>Silenciar</span>
              </button>

              <label class="visually-hidden" for="radio-player-volume">Volumen de la radio</label>
              <input class="volume-slider" type="range" id="radio-player-volume" min="0" max="100" step="1" value="80" />

              <button class="icon-button" type="button" id="radio-player-stop">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                  focusable="false">
                  <rect x="6.5" y="6.5" width="11" height="11" rx="1.6" fill="currentColor" />
                </svg>
                <span class="visually-hidden">Detener</span>
              </button>
            </div>
          </div>
        </div>

        <div class="list-pane">
          <div class="list-toolbar">
            <label class="visually-hidden" for="station-sort">Ordenar emisoras</label>
            <select class="list-toolbar__select" id="station-sort">
              <option value="default">Orden original</option>
              <option value="az">A–Z</option>
              <option value="category">Por categoría</option>
            </select>
          </div>
          <ul class="station-list" id="station-list"></ul>
        </div>
      </div>
      <noscript>
        <p class="panel__lead">Activa JavaScript para poder reproducir las emisoras en directo.</p>
      </noscript>
    </section>

    <section class="panel" id="panel-tv" role="tabpanel" aria-labelledby="tab-tv" hidden>
      <div class="tv-desk">
        <div class="video-stage" id="video-stage">
          <div class="video-stage__placeholder" id="video-placeholder">
            <svg class="icon icon--antenna" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
              focusable="false">
              <circle cx="12" cy="9" r="2.4" fill="currentColor" />
              <path
                d="M8.2 12.8a5.4 5.4 0 0 1 0-7.6M15.8 5.2a5.4 5.4 0 0 1 0 7.6M5.4 15.6a9.4 9.4 0 0 1 0-13.2M18.6 2.4a9.4 9.4 0 0 1 0 13.2"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              <path d="M12 11.6V22M8.5 22h7" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
            </svg>
            <p>Elige un canal para ver el directo</p>
          </div>

          <div class="video-stage__overlay" id="video-overlay" hidden>
            <span class="video-stage__channel" id="video-channel-name"></span>
            <span class="live-badge" id="video-state">
              <span class="live-badge__dot" aria-hidden="true"></span><span data-state-text>EN DIRECTO</span>
            </span>
          </div>

          <div class="video-stage__audio-only" id="video-audio-only" hidden>
            <span class="video-stage__audio-logo" id="video-audio-logo" aria-hidden="true"></span>
            <p class="video-stage__audio-name" id="video-audio-name"></p>
            <p class="video-stage__audio-hint">Escuchando solo el audio</p>
          </div>

          <div class="video-controls" id="video-controls">
            <button class="icon-button" type="button" id="video-toggle">
              <svg class="icon icon--play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                focusable="false">
                <path d="M8 5.13v13.74a1 1 0 0 0 1.52.85l10.77-6.87a1 1 0 0 0 0-1.7L9.52 4.28A1 1 0 0 0 8 5.13Z"
                  fill="currentColor" />
              </svg>
              <svg class="icon icon--pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                focusable="false" hidden>
                <rect x="7" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" />
                <rect x="13.6" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" />
              </svg>
              <span class="visually-hidden" data-toggle-label>Reproducir</span>
            </button>

            <button class="icon-button" type="button" id="video-stop">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                focusable="false">
                <rect x="6.5" y="6.5" width="11" height="11" rx="1.6" fill="currentColor" />
              </svg>
              <span class="visually-hidden">Detener</span>
            </button>

            <button class="icon-button" type="button" id="video-mute">
              <svg class="icon icon--volume" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                focusable="false">
                <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor" />
                <path d="M14.8 9.3a4 4 0 0 1 0 5.4" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" />
                <path d="M17.5 6.8a7.5 7.5 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" />
              </svg>
              <svg class="icon icon--muted" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                focusable="false" hidden>
                <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor" />
                <path d="m15 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" />
              </svg>
              <span class="visually-hidden" data-mute-label>Silenciar</span>
            </button>

            <label class="visually-hidden" for="video-volume">Volumen del vídeo</label>
            <input class="volume-slider" type="range" id="video-volume" min="0" max="100" step="1" value="80" />

            <button class="icon-button" type="button" id="video-audio-only-toggle" aria-pressed="false">
              <svg class="icon icon--headphones" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                aria-hidden="true" focusable="false">
                <path d="M4 14v-2a8 8 0 0 1 16 0v2" fill="none" stroke="currentColor" stroke-width="1.9"
                  stroke-linecap="round" />
                <rect x="3" y="13" width="3.5" height="6" rx="1.5" fill="currentColor" />
                <rect x="17.5" y="13" width="3.5" height="6" rx="1.5" fill="currentColor" />
              </svg>
              <span class="visually-hidden" data-audio-label>Solo audio</span>
            </button>

            <button class="icon-button" type="button" id="video-pip" hidden>
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                focusable="false">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor"
                  stroke-width="1.8" />
                <rect x="12" y="11.5" width="6" height="5" rx="1" fill="currentColor" />
              </svg>
              <span class="visually-hidden">Ver en ventana flotante</span>
            </button>

            <button class="icon-button" type="button" id="video-fullscreen">
              <svg class="icon icon--fullscreen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                aria-hidden="true" focusable="false">
                <path
                  d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M20 9V5.5A1.5 1.5 0 0 0 18.5 4H15M4 15v3.5A1.5 1.5 0 0 0 5.5 20H9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"
                  fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
              </svg>
              <svg class="icon icon--fullscreenExit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                aria-hidden="true" focusable="false" hidden>
                <path
                  d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4M15 4v3.5a1.5 1.5 0 0 0 1.5 1.5H20M9 20v-3.5A1.5 1.5 0 0 0 7.5 15H4M15 20v-3.5a1.5 1.5 0 0 1 1.5-1.5H20"
                  fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
              </svg>
              <span class="visually-hidden" data-fs-label>Pantalla completa</span>
            </button>

            <span class="video-controls__quality" id="video-quality">HLS</span>
          </div>
        </div>

        <div class="list-pane">
          <div class="list-toolbar">
            <label class="visually-hidden" for="channel-sort">Ordenar canales</label>
            <select class="list-toolbar__select" id="channel-sort">
              <option value="default">Orden original</option>
              <option value="az">A–Z</option>
              <option value="category">Por categoría</option>
            </select>
          </div>
          <ul class="channel-list" id="channel-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <aside class="mini-player" id="mini-player" aria-label="Reproductor en directo" hidden>
    <button class="mini-player__open" type="button" id="mini-player-open">
      <span class="mini-player__logo" id="mini-player-logo" aria-hidden="true"></span>
      <span class="mini-player__text">
        <span class="mini-player__name" id="mini-player-name"></span>
        <span class="mini-player__subtitle" id="mini-player-subtitle"></span>
      </span>
      <span class="live-badge mini-player__badge" id="mini-player-badge" aria-hidden="true"></span>
      <span class="visually-hidden">Volver al reproductor</span>
    </button>
    <div class="mini-player__controls">
      <button class="icon-button" type="button" id="mini-player-toggle">
        <svg class="icon icon--play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
          focusable="false" hidden>
          <path d="M8 5.13v13.74a1 1 0 0 0 1.52.85l10.77-6.87a1 1 0 0 0 0-1.7L9.52 4.28A1 1 0 0 0 8 5.13Z"
            fill="currentColor" />
        </svg>
        <svg class="icon icon--pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
          focusable="false">
          <rect x="7" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" />
          <rect x="13.6" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" />
        </svg>
        <span class="visually-hidden" data-toggle-label>Pausar</span>
      </button>
      <button class="icon-button" type="button" id="mini-player-stop">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="6.5" y="6.5" width="11" height="11" rx="1.6" fill="currentColor" />
        </svg>
        <span class="visually-hidden">Detener</span>
      </button>
    </div>
  </aside>

  <p class="visually-hidden" role="status" id="announcer"></p>
</body>

</html>
